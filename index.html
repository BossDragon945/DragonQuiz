<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>龍氏家族 2026年第一屆11月份 知識王大賽第一場</title>
  <meta name="description" content="胖胖龍爹地的Dragon家族線上測驗">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #C8932E;
      --gold-deep: #A07419;
      --gold-light: #E8B547;
      --dark: #1C1612;
      --dark-soft: #261D17;
      --paper: #FAE7C9;
      --red: #7A1F1F;
      --green: #5A6E4F;
      --text-light: #F5E6D3;
      --font-title: 'Noto Serif TC', serif;
      --font-body: 'Noto Sans TC', sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--dark);
      background-image:
        radial-gradient(ellipse at top, rgba(200,147,46,.13), transparent 60%),
        radial-gradient(ellipse at bottom, rgba(200,147,46,.07), transparent 60%);
      color: var(--text-light);
      font-family: var(--font-body);
      line-height: 1.7;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 24px 16px 64px;
    }

    .wrap { width: 100%; max-width: 680px; }

    .card {
      background: var(--dark-soft);
      border: 1px solid rgba(200,147,46,.3);
      border-radius: 14px;
      padding: 28px 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(200,147,46,.18);
    }

    h1 {
      font-family: var(--font-title);
      font-weight: 900;
      color: var(--gold-light);
      font-size: clamp(1.5rem, 5vw, 2.1rem);
      margin: 0 0 8px;
      text-align: center;
      letter-spacing: .04em;
      /* \n 會換行;太長時只在空格處換行,不在詞中間斷開;各行盡量等長 */
      white-space: pre-line;
      word-break: keep-all;
      overflow-wrap: break-word;
      text-wrap: balance;
    }

    .subtitle { text-align: center; color: rgba(245,230,211,.62); margin: 0 0 28px; font-size: .95rem; }

    /* ---------- 表單 ---------- */
    label.field { display: block; margin-bottom: 8px; font-weight: 500; color: var(--gold-light); }

    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      font-size: 1rem;
      font-family: inherit;
      color: var(--text-light);
      background: rgba(0,0,0,.28);
      border: 1px solid rgba(200,147,46,.42);
      border-radius: 8px;
    }
    input[type="text"]:focus { outline: 2px solid var(--gold); outline-offset: 1px; border-color: var(--gold); }

    .btn {
      display: inline-block;
      width: 100%;
      margin-top: 18px;
      padding: 13px 20px;
      font: inherit;
      font-weight: 700;
      color: var(--dark);
      background: linear-gradient(180deg, var(--gold-light), var(--gold));
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: filter .15s, transform .05s;
    }
    .btn:hover:not(:disabled) { filter: brightness(1.08); }
    .btn:active:not(:disabled) { transform: translateY(1px); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn.secondary {
      background: transparent;
      color: var(--gold-light);
      border: 1px solid rgba(200,147,46,.5);
    }
    .btn-row { display: flex; gap: 12px; }
    .btn-row .btn { margin-top: 0; }

    /* ---------- 進度 ---------- */
    .progress-meta {
      display: flex; justify-content: space-between;
      font-size: .85rem; color: rgba(245,230,211,.6); margin-bottom: 8px;
    }
    .bar { height: 6px; background: rgba(0,0,0,.35); border-radius: 99px; overflow: hidden; margin-bottom: 26px; }
    .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold-deep), var(--gold-light)); transition: width .25s; }

    /* ---------- 題目 ---------- */
    .qtext {
      font-family: var(--font-title);
      font-weight: 700;
      font-size: clamp(1.1rem, 3.6vw, 1.32rem);
      color: #fff;
      margin: 0 0 20px;
    }
    .qtext.has-tr { margin-bottom: 8px; }
    .qtrans { margin: 0 0 20px; }
    .qtrans p {
      margin: 0 0 4px;
      font-size: .92rem;
      line-height: 1.5;
      color: rgba(245,230,211,.72);
    }
    .qtrans p:last-child { margin-bottom: 0; }

    .opt { display: block; margin-bottom: 11px; }
    .opt input { position: absolute; opacity: 0; width: 0; height: 0; }
    .opt span {
      display: flex; align-items: center; gap: 12px;
      padding: 13px 16px;
      background: rgba(0,0,0,.22);
      border: 1px solid rgba(200,147,46,.26);
      border-radius: 9px;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    .opt span::before {
      content: attr(data-letter);
      flex: 0 0 26px; height: 26px;
      display: grid; place-items: center;
      font-weight: 700; font-size: .85rem;
      color: var(--gold-light);
      border: 1px solid rgba(200,147,46,.5);
      border-radius: 50%;
    }
    .otext { min-width: 0; }
    .otext small {
      display: block;
      margin-top: 3px;
      font-size: .82rem;
      line-height: 1.45;
      color: rgba(245,230,211,.62);
    }
    .opt span:hover { background: rgba(200,147,46,.1); border-color: rgba(200,147,46,.5); }
    .opt input:focus-visible + span { outline: 2px solid var(--gold); outline-offset: 2px; }
    .opt input:checked + span {
      background: rgba(200,147,46,.19);
      border-color: var(--gold);
    }
    .opt input:checked + span::before { background: var(--gold); color: var(--dark); border-color: var(--gold); }

    /* ---------- 結果 ---------- */
    .score {
      text-align: center;
      font-family: var(--font-title);
      font-weight: 900;
      font-size: clamp(2.6rem, 12vw, 3.6rem);
      color: var(--gold-light);
      line-height: 1.1;
      margin: 6px 0 2px;
    }
    .score small { display: block; font-size: 1rem; font-family: var(--font-body); font-weight: 400; color: rgba(245,230,211,.65); margin-top: 6px; }

    .review { margin-top: 26px; border-top: 1px solid rgba(200,147,46,.22); padding-top: 20px; }
    .review-item { padding: 14px 0; border-bottom: 1px dashed rgba(200,147,46,.16); }
    .review-item:last-child { border-bottom: none; }
    .review-q { font-weight: 500; margin-bottom: 6px; }
    .tag { display: inline-block; font-size: .78rem; font-weight: 700; padding: 2px 9px; border-radius: 99px; margin-right: 8px; }
    .tag.ok { background: var(--green); color: #fff; }
    .tag.no { background: var(--red); color: #fff; }
    .review-detail { font-size: .9rem; color: rgba(245,230,211,.72); }
    .review-detail em { color: var(--gold-light); font-style: normal; font-weight: 500; }

    .status { margin-top: 20px; padding: 12px 14px; border-radius: 8px; font-size: .9rem; text-align: center; }
    .status.pending { background: rgba(200,147,46,.12); color: var(--gold-light); }
    .status.ok { background: rgba(90,110,79,.28); color: #cfe3c2; }
    .status.err { background: rgba(122,31,31,.3); color: #f0c9c9; }

    /* ---------- 連線中 ---------- */
    .loading { text-align: center; padding: 18px 0 8px; }
    .spinner {
      width: 38px; height: 38px; margin: 0 auto 18px;
      border: 3px solid rgba(200,147,46,.22);
      border-top-color: var(--gold-light);
      border-radius: 50%;
      animation: spin .9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
    #loading-text { margin: 0; color: rgba(245,230,211,.72); font-size: .95rem; }
    #loading-text .hint { display: block; margin-top: 8px; font-size: .85rem; color: rgba(245,230,211,.5); }

    .name-msg { margin: 8px 0 0; font-size: .88rem; }
    .name-msg.bad { color: #ff9e9e; }
    .name-msg.checking { color: rgba(245,230,211,.5); }

    .hidden { display: none !important; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* ---------- 計時 ---------- */
    .timer { display: flex; justify-content: space-between; align-items: baseline; font-size: .85rem; color: rgba(245,230,211,.6); margin-bottom: 6px; }
    .timer b { font-size: 1.15rem; color: var(--gold-light); font-variant-numeric: tabular-nums; }
    .timer.urgent b { color: #ff8a80; }
    .tbar { margin-bottom: 22px; }
    .tbar > i { transition: none; }
    .timer.urgent + .tbar > i { background: linear-gradient(90deg, #7A1F1F, #ff8a80); }

    /* 作答中不能選取、複製題目文字 */
    #screen-quiz { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }

    .rules { margin: 18px 0 0; padding: 14px 16px 14px 34px; background: rgba(0,0,0,.2); border-radius: 9px; font-size: .9rem; color: rgba(245,230,211,.78); }
    .rules li { margin: 2px 0; }
    .loading { text-align: center; color: rgba(245,230,211,.6); padding: 40px 0; }
    .tag.warn { background: #6b5a2e; color: #fff; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1 id="title">載入中…</h1>
      <p class="subtitle" id="subtitle"></p>

      <!-- ======== 畫面 0:連線中 ======== -->
      <section id="screen-loading" class="hidden">
        <div class="loading">
          <div class="spinner" aria-hidden="true"></div>
          <p id="loading-text">正在連線…</p>
        </div>
      </section>

      <!-- ======== 畫面 1:開始 ======== -->
      <section id="screen-start" class="hidden">
        <div id="name-block">
          <label class="field" for="player">你的名字</label>
          <input type="text" id="player" maxlength="20" autocomplete="name" placeholder="請輸入名字">
          <p id="name-msg" class="name-msg hidden" role="status"></p>
        </div>
        <ul class="rules" id="rules"></ul>
        <button class="btn" id="btn-start">開始作答</button>
      </section>

      <!-- ======== 畫面 4:通知(已作答過 / 非活動時間)======== -->
      <section id="screen-used" class="hidden">
        <div class="loading">
          <p id="used-icon" style="font-size:2.6rem;margin:0 0 10px">🔒</p>
          <p id="used-text">你已經作答過了,每個人只能作答一次。</p>
          <p id="used-detail" class="name-msg hidden" style="margin-top:10px"></p>
        </div>
      </section>

      <!-- ======== 畫面 2:作答 ======== -->
      <section id="screen-quiz" class="hidden">
        <div class="progress-meta">
          <span id="pmeta"></span><span id="pname"></span>
        </div>
        <div class="bar"><i id="pbar" style="width:0%"></i></div>

        <div id="qbox" class="hidden">
          <div class="timer" id="timer"><span>剩餘時間</span><b id="tleft"></b></div>
          <div class="bar tbar"><i id="tbar" style="width:100%"></i></div>

          <h2 class="qtext" id="qtext"></h2>
          <div class="qtrans hidden" id="qtrans"></div>
          <div id="opts" role="radiogroup" aria-labelledby="qtext"></div>

          <button class="btn" id="btn-next" disabled>確定</button>
        </div>

        <div class="loading hidden" id="qloading">載入中…</div>
        <div id="qstatus" class="status hidden"></div>
        <button class="btn hidden" id="btn-retry">重試</button>
        <button class="btn secondary hidden" id="btn-restart">重新開始</button>
      </section>

      <!-- ======== 畫面 3:結果 ======== -->
      <section id="screen-result" class="hidden">
        <div class="score" id="score"></div>
        <p class="subtitle" style="margin:8px 0 0" id="score-note"></p>
        <div class="status ok">結果已記錄 ✓</div>
        <div class="review" id="review"></div>
        <p class="name-msg" style="text-align:center;margin-top:24px">每個人只能作答一次,感謝參加 🐲</p>
      </section>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
  (function () {
    "use strict";

    // 題庫、正解、計分都在 Apps Script 那邊。
    // 題目在 begin 時一次拿到(不含正解),換題純在本機處理;
    // 作答秒數由這裡回報,伺服器依此判斷逾時並批改。

    var LETTERS = ["A", "B", "C", "D", "E", "F"];
    var STATUS_TEXT = { ok: "答對", wrong: "答錯", timeout: "逾時", left: "離開畫面" };
    var apiUrl = (QUIZ_CONFIG.appsScriptUrl || "").trim();

    var session = null;
    var total = 0;
    var step = 0;
    var questions = [];    // begin 一次拿到的全部題目(不含正解)
    var picks = [];        // 每題的 { pick, secs, left },交卷時一起送出
    var question = null;   // 目前顯示中、還沒作答的題目
    var picked = null;
    var busy = false;
    var pending = null;    // 送出失敗時,重試用的內容
    var deadline = 0;
    var startedAt = 0;     // 這一題開始作答的時間,用來算作答秒數
    var timerId = null;
    var nameOk = null;     // 名字查詢結果:true 可用 / false 已用過 / null 還沒查
    var nameTimer = null;
    var checking = null;   // 進行中的查詢 Promise

    /* ---------- 只能作答一次:瀏覽器這一側 ---------- */
    var DONE_KEY = "dragonquiz.done." + (QUIZ_CONFIG.round || "1");

    function markDone() {
      try { localStorage.setItem(DONE_KEY, String(Date.now())); } catch (e) { /* 無痕模式會擋 */ }
    }
    function alreadyDone() {
      try { return !!localStorage.getItem(DONE_KEY); } catch (e) { return false; }
    }
    var playerName = "";

    var $ = function (id) { return document.getElementById(id); };
    function show(id) {
      ["screen-loading", "screen-start", "screen-quiz", "screen-result", "screen-used"].forEach(function (s) {
        $(s).classList.toggle("hidden", s !== id);
      });
    }

    function esc(s) {
      return String(s).replace(/[&<>"]/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
      });
    }

    function setStatus(kind, text) {
      var box = $("qstatus");
      box.className = "status " + kind + (text ? "" : " hidden");
      box.textContent = text || "";
    }

    /* ---------- 與 Apps Script 溝通 ---------- */

    // Apps Script 偶爾會回 404 或直接斷線,尤其在短時間內被連續呼叫時。
    // 這類故障跟請求內容無關,重送一次通常就好。
    function isTransient(err) {
      if (err && err.transient) return true;
      var m = String(err && err.message || "");
      return /^HTTP (404|429|5\d\d)$/.test(m) || /Failed to fetch|NetworkError|Load failed/i.test(m);
    }

    // POST 的結果要經過一次 302 轉址才拿得到。那個轉址失效時,Google 會改用
    // GET 重跑腳本、回傳 doGet 的輸出 —— 它長得像成功(ok:true)但內容完全
    // 不是你要的。靠 type 欄位辨識出來,當成暫時性故障重試。
    var EXPECT = { begin: ["begin"], check: ["check"], claim: ["claim"], submit: ["result"] };
    function checkType(payload, res) {
      var want = EXPECT[payload.action];
      if (want && want.indexOf(res.type) === -1) {
        var e = new Error("伺服器回應不是這次請求的結果");
        e.transient = true;
        throw e;
      }
      return res;
    }

    // submit 在伺服器端是冪等的(已交卷的 session 會直接回傳先前成績,不重複計分),
    // 所以重送安全。begin 會產生新 session 與新的一列紀錄,不能自動重送。
    // begin 失敗重送會在試算表多留一列「(未開始)」,但那跟「開了頁面就離開」
    // 長得一樣、不會被誤判成作答紀錄,所以為了載入可靠性還是允許重試。
    var RETRYABLE = { begin: true, check: true, submit: true, answer: true };
    function postWithRetry(payload, tries) {
      tries = tries || 0;
      return post(payload).catch(function (err) {
        var canRetry = RETRYABLE[payload.action] && tries < 3 && isTransient(err);
        if (!canRetry) throw err;
        return new Promise(function (resolve) {
          setTimeout(resolve, 800 * Math.pow(2, tries));   // 0.8s → 1.6s → 3.2s
        }).then(function () {
          return postWithRetry(payload, tries + 1);
        });
      });
    }

    function post(payload) {
      // 用 text/plain 送出,避開 CORS 預檢請求(Apps Script 不處理 OPTIONS)
      return fetch(apiUrl, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      })
        .then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        })
        .then(function (res) {
          if (!res || res.ok === false) {
            var e = new Error((res && res.error) || "伺服器回報失敗");
            e.code = res && res.code;
            e.detail = res && res.detail;
            if (e.code === "BUSY") e.transient = true;   // 伺服器排隊逾時,稍後重試
            throw e;
          }
          return checkType(payload, res);
        });
    }

    function send(payload) {
      busy = true;
      pending = payload;
      $("qbox").classList.add("hidden");
      $("qloading").classList.remove("hidden");
      $("btn-retry").classList.add("hidden");
      $("btn-restart").classList.add("hidden");

      postWithRetry(payload)
        .then(function (res) {
          busy = false;
          pending = null;
          if (res.session) session = res.session;
          if (res.total) total = res.total;

          if (res.done) { renderResult(res); return; }

          if (res.questions) {              // begin 的回應:一次拿到全部題目
            questions = res.questions;
            picks = [];
            renderQuestion(0);
            return;
          }

          // 回應既不是成績也不是題目 —— 寧可明確報錯,也不要拿 undefined 去畫面上炸
          throw new Error("伺服器回應格式不符");
        })
        .catch(function (err) {
          busy = false;
          $("qloading").classList.add("hidden");

          if (err.code === "TAKEN") {          // 伺服器的權威判定:這個名字已經用過
            notice("🔒", err.message);
            return;
          }
          if (err.code === "CLOSED") {
            notice("🕒", err.message, err.detail);
            return;
          }

          // 後端回報的邏輯錯誤(例如題庫格式有問題)不是連線失敗,別誤導
          setStatus("err", (isTransient(err) ? "連線失敗:" : "") + err.message);
          if (err.code === "EXPIRED") $("btn-restart").classList.remove("hidden");
          else $("btn-retry").classList.remove("hidden");
        });
    }

    /* ---------- 載入 ---------- */
    $("title").textContent = QUIZ_CONFIG.title || "線上測驗";
    $("subtitle").textContent = QUIZ_CONFIG.subtitle || "";
    document.title = QUIZ_CONFIG.title || document.title;

    var loadTimers = [];
    function stopLoading() {
      loadTimers.forEach(clearTimeout);
      loadTimers = [];
    }
    function loadFail(msg) {
      stopLoading();
      $("title").textContent = "測驗載入失敗";
      $("subtitle").textContent = msg;
      show(null);
    }

    // 通知畫面:已經作答過、或不在活動時間內
    function notice(icon, text, detail) {
      stopLoading();
      stopTimer();
      question = null;
      $("used-icon").textContent = icon;
      $("used-text").textContent = text;
      $("used-detail").textContent = detail || "";
      $("used-detail").classList.toggle("hidden", !detail);
      show("screen-used");
    }

    if (!apiUrl) {
      loadFail("尚未設定 appsScriptUrl(見 README)");
    } else if (alreadyDone()) {
      // 這台瀏覽器這一場已經作答過,連題目都不抓
      notice("🔒", "你已經作答過了,每個人只能作答一次。");
    } else {
      // Apps Script 閒置後會休眠,冷啟動實測約 10 秒。沒有提示的話
      // 使用者只會看到一張空卡片,會以為壞掉。
      show("screen-loading");
      loadTimers.push(setTimeout(function () {
        $("loading-text").innerHTML =
          '正在喚醒測驗伺服器…<span class="hint">第一次開啟比較慢,請再等一下</span>';
      }, 2500));
      loadTimers.push(setTimeout(function () {
        $("loading-text").innerHTML =
          '還在連線中…<span class="hint">已經等了一段時間,若超過 30 秒仍無反應,請重新整理頁面</span>';
      }, 12000));

      // 開頁面時就把題目抓好(此時還不知道名字,按下開始後由 claim 補上)。
      // 使用者在讀規則、打名字的期間就載入完了,按「開始作答」是瞬間的。
      prefetch();
    }

    function prefetch() {
      return postWithRetry({ action: "begin", name: "" })
        .then(function (res) {
          stopLoading();
          session = res.session;
          total = res.total;
          questions = res.questions;

          var limits = questions.map(function (q) { return q.limit; });
          var same = limits.every(function (x) { return x === limits[0]; });
          var rules = [
            "共 " + total + " 題,一次一題,不能回到上一題",
            same ? "每題限時 " + limits[0] + " 秒,時間到自動交出" : "每題都有作答時間限制,時間到自動交出",
            "作答中切換到其他 App、分頁或視窗,該題直接算錯",
            "每個人的題目與選項順序都不一樣"
          ];
          $("rules").innerHTML = rules.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("");
          if (!QUIZ_CONFIG.requireName) $("name-block").classList.add("hidden");
          show("screen-start");
        })
        .catch(function (err) {
          if (err && err.code === "CLOSED") {
            notice("🕒", err.message, err.detail);
            return;
          }
          loadFail(err.message);
        });
    }

    /* ---------- 名字查詢:打字時就先問,按下開始才不用等 ---------- */
    function setNameMsg(kind, text) {
      var el = $("name-msg");
      el.className = "name-msg " + kind + (text ? "" : " hidden");
      el.textContent = text || "";
    }

    function runCheck(name) {
      setNameMsg("checking", "確認中…");
      checking = postWithRetry({ action: "check", session: session, name: name })
        .then(function (res) {
          if ($("player").value.trim() !== name) return;   // 名字又改了,這次結果作廢
          nameOk = !res.taken;
          setNameMsg(res.taken ? "bad" : "",
                     res.taken ? "「" + name + "」已經作答過了,每個人只能作答一次" : "");
          $("btn-start").disabled = !!res.taken;
        })
        .catch(function () {
          // 查詢失敗就先放行 —— 交卷時伺服器還會再擋一次,不會漏掉
          nameOk = null;
          setNameMsg("", "");
          $("btn-start").disabled = false;
        })
        .then(function () { checking = null; });
      return checking;
    }

    $("player").addEventListener("input", function () {
      nameOk = null;
      $("btn-start").disabled = false;
      setNameMsg("", "");
      clearTimeout(nameTimer);
      var v = this.value.trim();
      if (!v) return;
      nameTimer = setTimeout(function () { runCheck(v); }, 600);
    });

    /* ---------- 開始 ---------- */
    $("btn-start").addEventListener("click", function () {
      if (!QUIZ_CONFIG.requireName) { playerName = ""; beginQuiz(); return; }

      playerName = $("player").value.trim();
      if (!playerName) { $("player").focus(); return; }
      if (nameOk === false) return;                        // 已知用過,不放行

      if (nameOk === null) {                               // 還沒查完:等查完再決定
        clearTimeout(nameTimer);
        (checking || runCheck(playerName)).then(function () {
          if (nameOk !== false) beginQuiz();
        });
        return;
      }
      beginQuiz();
    });

    function beginQuiz() {
      // 題目已經在頁面載入時抓好了,這裡不需要任何網路等待
      question = null;
      picks = [];
      $("pname").textContent = playerName;
      $("pmeta").textContent = "";
      $("pbar").style.width = "0%";
      setStatus("", "");
      show("screen-quiz");

      // 按下開始就算用掉機會,所以這裡就記下,不是等交卷才記
      markDone();

      // 把名字補回試算表那列。刻意不等結果 —— 等於背景作業。
      // 萬一伺服器回報名字已被用掉(前端沒攔到的競態),直接擋下。
      postWithRetry({ action: "claim", session: session, name: playerName || "(未具名)" })
        .catch(function (err) {
          if (!err) return;
          if (err.code === "TAKEN") notice("🔒", err.message);
          else if (err.code === "CLOSED") notice("🕒", err.message, err.detail);
        });

      renderQuestion(0);
    }

    /* ---------- 作答畫面 ---------- */
    function renderQuestion(s) {
      var q = questions[s];
      if (!q) { setStatus("err", "題目資料不完整,請重新開始"); return; }

      question = q;
      step = s;
      picked = null;

      $("qloading").classList.add("hidden");
      $("qbox").classList.remove("hidden");
      $("pmeta").textContent = "第 " + (s + 1) + " / " + total + " 題";
      $("pbar").style.width = (s / total * 100) + "%";
      $("qtext").textContent = q.q;

      // 翻譯顯示在題目下方,沒填的語言不顯示
      var trBox = $("qtrans");
      trBox.innerHTML = "";
      var tr = q.tr || {};
      ["ja", "vi", "en"].forEach(function (k) {
        if (!tr[k]) return;
        var p = document.createElement("p");
        p.lang = k;
        p.textContent = tr[k];
        trBox.appendChild(p);
      });
      var hasTr = trBox.children.length > 0;
      trBox.classList.toggle("hidden", !hasTr);
      $("qtext").classList.toggle("has-tr", hasTr);

      var box = $("opts");
      box.innerHTML = "";
      q.options.forEach(function (text, i) {
        var label = document.createElement("label");
        label.className = "opt";

        var input = document.createElement("input");
        input.type = "radio";
        input.name = "q" + s;
        input.value = String(i);
        input.addEventListener("change", function () {
          picked = i;
          $("btn-next").disabled = false;
          setStatus("", "");          // 清掉上一題「離開畫面」的提示
        });

        var span = document.createElement("span");
        span.setAttribute("data-letter", LETTERS[i] || (i + 1));

        var body = document.createElement("div");
        body.className = "otext";
        body.appendChild(document.createTextNode(text));
        // 選項翻譯顯示在選項文字下方,沒填的語言不顯示
        var otr = (q.otr && q.otr[i]) || {};
        var shown = [text];            // 跟原文或前一行一模一樣的翻譯(例如英文專有名詞)不重複顯示
        ["ja", "vi", "en"].forEach(function (k) {
          if (!otr[k] || shown.indexOf(otr[k]) !== -1) return;
          shown.push(otr[k]);
          var t = document.createElement("small");
          t.lang = k;
          t.textContent = otr[k];
          body.appendChild(t);
        });
        span.appendChild(body);

        label.appendChild(input);
        label.appendChild(span);
        box.appendChild(label);
      });

      $("btn-next").disabled = true;
      $("btn-next").textContent = s === total - 1 ? "交卷" : "確定";
      startTimer(q.limit);
    }

    function startTimer(limit) {
      stopTimer();
      startedAt = Date.now();
      deadline = startedAt + limit * 1000;
      var tick = function () {
        var left = Math.max(0, deadline - Date.now());
        $("tleft").textContent = Math.ceil(left / 1000) + " 秒";
        $("tbar").style.width = (left / (limit * 1000) * 100) + "%";
        $("timer").classList.toggle("urgent", left <= 5000);
        if (left <= 0) submit(false);  // 時間到:有選就交選的,沒選算逾時
      };
      tick();
      timerId = setInterval(tick, 100);
    }

    function stopTimer() {
      if (timerId) clearInterval(timerId);
      timerId = null;
    }

    function submit(left) {
      if (busy || !question) return;
      stopTimer();

      var secs = (Date.now() - startedAt) / 1000;
      picks[step] = {
        pick: left ? null : picked,
        secs: Math.round(secs * 10) / 10,
        left: !!left
      };

      question = null;
      setStatus(left ? "err" : "", left ? "你剛剛離開了作答畫面,該題以答錯計算" : "");

      // 換題完全在本機,不跟伺服器往返 —— 所以是瞬間的
      if (step < total - 1) renderQuestion(step + 1);
      else send({ action: "submit", session: session, picks: picks, name: playerName || "(未具名)" });
    }

    $("btn-next").addEventListener("click", function () {
      if (picked !== null) submit(false);
    });

    $("btn-retry").addEventListener("click", function () {
      if (pending && !busy) { setStatus("", ""); send(pending); }
    });

    $("btn-restart").addEventListener("click", function () {
      restart();
    });

    // 重新開始需要一份全新的 session(舊的已交卷或已失效),所以要再抓一次題目
    function restart() {
      session = null;
      questions = [];
      picks = [];
      question = null;
      stopTimer();
      setStatus("", "");
      $("loading-text").textContent = "正在重新取得題目…";
      show("screen-loading");
      prefetch();
    }

    /* ---------- 防作弊 ---------- */
    // 題目顯示中離開畫面(切 App、切分頁、點到別的視窗),該題直接算錯
    function onLeave() {
      if (question && !busy) submit(true);
    }
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) onLeave();
    });
    window.addEventListener("blur", onLeave);

    // 作答中不能複製、右鍵、拖曳題目文字
    ["copy", "cut", "contextmenu", "selectstart", "dragstart"].forEach(function (type) {
      $("screen-quiz").addEventListener(type, function (e) { e.preventDefault(); });
    });

    /* ---------- 結果 ---------- */
    function renderResult(res) {
      stopTimer();
      question = null;

      $("score").innerHTML = res.score + " / " + res.total +
        "<small>答對率 " + res.percent + "%</small>";
      var notes = [];
      if (res.timeouts) notes.push("逾時 " + res.timeouts + " 題");
      if (res.leaves) notes.push("離開畫面 " + res.leaves + " 次");
      $("score-note").textContent = notes.join(" · ");

      var rev = $("review");
      rev.innerHTML = "";
      rev.classList.toggle("hidden", !Array.isArray(res.review));
      (res.review || []).forEach(function (r, i) {
        var item = document.createElement("div");
        item.className = "review-item";

        var qline = document.createElement("div");
        qline.className = "review-q";
        var tag = document.createElement("span");
        tag.className = "tag " + (r.status === "ok" ? "ok" : r.status === "wrong" ? "no" : "warn");
        tag.textContent = STATUS_TEXT[r.status] || r.status;
        qline.appendChild(tag);
        qline.appendChild(document.createTextNode((i + 1) + ". " + r.q));
        item.appendChild(qline);

        var d = document.createElement("div");
        d.className = "review-detail";
        var yours = r.yours || "(未作答)";
        d.innerHTML = r.status === "ok"
          ? "你的答案:<em>" + esc(yours) + "</em>"
          : "你的答案:" + esc(yours) + "　正解:<em>" + esc(r.correct) + "</em>";
        if (r.explain) d.innerHTML += "<br>" + esc(r.explain);
        item.appendChild(d);

        rev.appendChild(item);
      });

      show("screen-result");
    }

  })();
  </script>
</body>
</html>
